# The start configuration of Bridge's own tmux server (tmux -L kindi-bridge -f this file). It applies before the first
# pane starts, so pi sees extended keys when it checks them at its start. The user's own configuration loads first.
source-file -q ~/.tmux.conf
set-option -s extended-keys on
